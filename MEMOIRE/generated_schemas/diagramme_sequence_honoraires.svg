<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1370" viewBox="0 0 1260 1370">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#2f5597"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:22px;font-weight:bold}.actor{font-size:14px;font-weight:bold}.msg{font-size:12px}.alt{font-size:12px;font-weight:bold}</style></defs><rect x="0" y="0" width="1260" height="1370" fill="#ffffff"/><text class="title" x="630" y="36" text-anchor="middle">Diagramme de séquence - Calcul des honoraires</text><rect x="80" y="80" width="160" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.5"/><text class="actor" x="160" y="109" text-anchor="middle" fill="#1f2937">Administrateur</text><line x1="160" y1="128" x2="160" y2="1330" stroke="#888" stroke-dasharray="7 6"/><rect x="310" y="80" width="160" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.5"/><text class="actor" x="390" y="109" text-anchor="middle" fill="#1f2937">Interface web</text><line x1="390" y1="128" x2="390" y2="1330" stroke="#888" stroke-dasharray="7 6"/><rect x="540" y="80" width="160" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.5"/><text class="actor" x="620" y="109" text-anchor="middle" fill="#1f2937">API Honoraires</text><line x1="620" y1="128" x2="620" y2="1330" stroke="#888" stroke-dasharray="7 6"/><rect x="770" y="80" width="160" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.5"/><text class="actor" x="850" y="109" text-anchor="middle" fill="#1f2937">HonorairesService</text><line x1="850" y1="128" x2="850" y2="1330" stroke="#888" stroke-dasharray="7 6"/><rect x="1000" y="80" width="160" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.5"/><text class="actor" x="1080" y="109" text-anchor="middle" fill="#1f2937">Base de données</text><line x1="1080" y1="128" x2="1080" y2="1330" stroke="#888" stroke-dasharray="7 6"/><line x1="160" y1="175" x2="390" y2="175" stroke="#2f5597" stroke-width="1.6" marker-end="url(#arrow)"/><text class="msg" x="275" y="167" text-anchor="middle" fill="#111827">Choisir enseignant, année et mois</text><line x1="390" y1="245" x2="620" y2="245" stroke="#2f5597" stroke-width="1.6" marker-end="url(#arrow)"/><text class="msg" x="505" y="223" text-anchor="middle" fill="#111827">GET /api/honoraires/preview</text><text class="msg" x="505" y="237" text-anchor="middle" fill="#111827">(enseignantId, année, mois)</text><line x1="620" y1="315" x2="850" y2="315" stroke="#2f5597" stroke-width="1.6" marker-end="url(#arrow)"/><text class="msg" x="735" y="307" text-anchor="middle" fill="#111827">previewHonoraires(...)</text><line x1="850" y1="385" x2="1080" y2="385" stroke="#2f5597" stroke-width="1.6" marker-end="url(#arrow)"/><text class="msg" x="965" y="377" text-anchor="middle" fill="#111827">Vérifier rôle administrateur</text><line x1="850" y1="455" x2="1080" y2="455" stroke="#2f5597" stroke-width="1.6" marker-end="url(#arrow)"/><text class="msg" x="965" y="447" text-anchor="middle" fill="#111827">Charger enseignant et séances payables validées</text><line x1="1080" y1="525" x2="850" y2="525" stroke="#2f5597" stroke-width="1.6" marker-start="url(#arrow)"/><text class="msg" x="965" y="517" text-anchor="middle" fill="#111827">Séances non encore payées</text><line x1="850" y1="595" x2="620" y2="595" stroke="#2f5597" stroke-width="1.6" marker-start="url(#arrow)"/><text class="msg" x="735" y="587" text-anchor="middle" fill="#111827">Prévisualisation : heures et montant brut</text><line x1="620" y1="665" x2="390" y2="665" stroke="#2f5597" stroke-width="1.6" marker-start="url(#arrow)"/><text class="msg" x="505" y="657" text-anchor="middle" fill="#111827">Afficher le détail du calcul</text><line x1="160" y1="735" x2="390" y2="735" stroke="#2f5597" stroke-width="1.6" marker-end="url(#arrow)"/><text class="msg" x="275" y="727" text-anchor="middle" fill="#111827">Confirmer le calcul</text><line x1="390" y1="805" x2="620" y2="805" stroke="#2f5597" stroke-width="1.6" marker-end="url(#arrow)"/><text class="msg" x="505" y="797" text-anchor="middle" fill="#111827">POST /api/honoraires/calculer</text><line x1="620" y1="875" x2="850" y2="875" stroke="#2f5597" stroke-width="1.6" marker-end="url(#arrow)"/><text class="msg" x="735" y="867" text-anchor="middle" fill="#111827">calculerHonoraires(...)</text><line x1="850" y1="945" x2="1080" y2="945" stroke="#2f5597" stroke-width="1.6" marker-end="url(#arrow)"/><text class="msg" x="965" y="923" text-anchor="middle" fill="#111827">Créer/mettre à jour HonorairesCalculs</text><text class="msg" x="965" y="937" text-anchor="middle" fill="#111827">+ DetailHonoraire</text><rect x="55" y="961" width="1150" height="36" rx="4" fill="#fff7d6" stroke="#d6b656"/><text class="alt" x="70" y="984" fill="#7a5b00">alt : Erreur : aucune séance payable ou calcul déjà existant/payé</text><line x1="1080" y1="1015" x2="850" y2="1015" stroke="#2f5597" stroke-width="1.6" marker-start="url(#arrow)"/><text class="msg" x="965" y="1007" text-anchor="middle" fill="#111827">Calcul sauvegardé au statut BROUILLON</text><line x1="850" y1="1085" x2="620" y2="1085" stroke="#2f5597" stroke-width="1.6" marker-start="url(#arrow)"/><text class="msg" x="735" y="1077" text-anchor="middle" fill="#111827">HonorairesCalculDto</text><line x1="620" y1="1155" x2="390" y2="1155" stroke="#2f5597" stroke-width="1.6" marker-start="url(#arrow)"/><text class="msg" x="505" y="1147" text-anchor="middle" fill="#111827">Afficher le calcul enregistré</text><line x1="390" y1="1225" x2="160" y2="1225" stroke="#2f5597" stroke-width="1.6" marker-start="url(#arrow)"/><text class="msg" x="275" y="1203" text-anchor="middle" fill="#111827">Afficher le total des heures, le montant brut</text><text class="msg" x="275" y="1217" text-anchor="middle" fill="#111827">et les détails par séance</text>
</svg>
