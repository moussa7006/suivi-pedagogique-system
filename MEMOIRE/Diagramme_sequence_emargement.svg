<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1090" viewBox="0 0 1400 1090">
  <defs>
    <marker id="arrReq" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="arrRet" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="arrOk" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#059669"/>
    </marker>
    <marker id="arrErr" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#dc2626"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:24px;font-weight:bold;fill:#0f172a}
      .phase{font-size:15px;font-weight:bold;fill:#475569}
      .actor{font-size:13px;font-weight:bold;fill:#1e293b}
      .msg{font-size:12.5px;fill:#1e293b}
      .ital{font-style:italic}
      .msgRet{font-size:12.5px;fill:#475569;font-style:italic}
      .msgOk{font-size:12.5px;fill:#065f46}
      .msgErr{font-size:12.5px;fill:#b91c1c}
      .altTitle{font-size:13px;font-weight:bold;fill:#78350f}
      .selfLbl{font-size:12px;fill:#1e293b}
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="1090" fill="#ffffff"/>

  <!-- Titre -->
  <text class="title" x="700" y="34" text-anchor="middle">Diagramme de séquence – Processus d'émargement par QR code</text>

  <!-- ==================== LIFELINES ==================== -->
  <!-- Acteurs -->
  <rect x="8"  y="82" width="94"  height="42" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text class="actor" x="55" y="108" text-anchor="middle">Administrateur</text>

  <rect x="260" y="82" width="150" height="42" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text class="actor" x="335" y="108" text-anchor="middle">Enseignant (Mobile)</text>

  <rect x="500" y="82" width="150" height="42" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text class="actor" x="575" y="100" text-anchor="middle">API REST</text>
  <text class="actor" x="575" y="116" text-anchor="middle">Spring Boot</text>

  <rect x="750" y="82" width="150" height="42" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text class="actor" x="825" y="100" text-anchor="middle">Service Émargement</text>
  <text class="actor" x="825" y="116" text-anchor="middle">+ QR Code</text>

  <rect x="990" y="82" width="116" height="42" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="actor" x="1048" y="108" text-anchor="middle">Base de données</text>

  <!-- Lignes de vie -->
  <line x1="55"  y1="135" x2="55"  y2="1070" stroke="#94a3b8" stroke-dasharray="7 6"/>
  <line x1="335" y1="135" x2="335" y2="1070" stroke="#94a3b8" stroke-dasharray="7 6"/>
  <line x1="575" y1="135" x2="575" y2="1070" stroke="#94a3b8" stroke-dasharray="7 6"/>
  <line x1="825" y1="135" x2="825" y2="1070" stroke="#94a3b8" stroke-dasharray="7 6"/>
  <line x1="1048" y1="135" x2="1048" y2="1070" stroke="#94a3b8" stroke-dasharray="7 6"/>

  <!-- ==================== PHASE 1 : Génération du QR ==================== -->
  <text class="phase" x="40" y="178">Phase 1 — Génération du QR code (Administrateur)</text>

  <line x1="55" y1="200" x2="575" y2="200" stroke="#334155" stroke-width="1.6" marker-end="url(#arrReq)"/>
  <text class="msg" x="315" y="192" text-anchor="middle">POST /api/qr-codes {séanceId}</text>

  <line x1="575" y1="225" x2="825" y2="225" stroke="#334155" stroke-width="1.6" marker-end="url(#arrReq)"/>
  <text class="msg" x="700" y="217" text-anchor="middle">Créer le QR code avec date d'expiration</text>

  <line x1="825" y1="250" x2="1048" y2="250" stroke="#334155" stroke-width="1.6" marker-end="url(#arrReq)"/>
  <text class="msg ital" x="936" y="242" text-anchor="middle">INSERT QRCode</text>

  <line x1="825" y1="278" x2="55" y2="278" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrRet)"/>
  <text class="msgRet" x="440" y="270" text-anchor="middle">QR code généré (affiché à l'écran de la salle)</text>

  <!-- ==================== PHASE 2 : Sélection de la séance ==================== -->
  <text class="phase" x="40" y="305">Phase 2 — L'enseignant sélectionne sa séance du jour</text>

  <line x1="335" y1="325" x2="575" y2="325" stroke="#334155" stroke-width="1.6" marker-end="url(#arrReq)"/>
  <text class="msg" x="455" y="317" text-anchor="middle">GET /api/seances/du-jour</text>

  <line x1="575" y1="350" x2="825" y2="350" stroke="#334155" stroke-width="1.6" marker-end="url(#arrReq)"/>
  <text class="msg" x="700" y="342" text-anchor="middle">Lister les séances d'aujourd'hui</text>

  <line x1="825" y1="375" x2="1048" y2="375" stroke="#334155" stroke-width="1.6" marker-end="url(#arrReq)"/>
  <text class="msg ital" x="936" y="367" text-anchor="middle">SELECT séances</text>

  <line x1="575" y1="403" x2="335" y2="403" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrRet)"/>
  <text class="msgRet" x="455" y="395" text-anchor="middle">Liste des séances du jour</text>

  <!-- Auto-message Enseignant -->
  <line x1="335" y1="428" x2="268" y2="428" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="268" y1="428" x2="268" y2="456" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="268" y1="456" x2="335" y2="456" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrRet)"/>
  <text class="msgRet" x="345" y="424">Sélectionne la séance à émarger</text>

  <!-- ==================== PHASE 3 : Scan QR + validations ==================== -->
  <text class="phase" x="40" y="485">Phase 3 — Scan du QR code et validations</text>

  <line x1="335" y1="510" x2="575" y2="510" stroke="#334155" stroke-width="1.6" marker-end="url(#arrReq)"/>
  <text class="msg" x="455" y="492" text-anchor="middle">POST /api/emargements/scan</text>
  <text class="msg" x="455" y="505" text-anchor="middle">{seanceId, tokenQRCode, lat, lon}</text>

  <line x1="575" y1="540" x2="825" y2="540" stroke="#334155" stroke-width="1.6" marker-end="url(#arrReq)"/>
  <text class="msg" x="700" y="532" text-anchor="middle">faireEmargement(request)</text>

  <!-- Bloc alt : validations -->
  <rect x="742" y="562" width="360" height="188" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text class="altTitle" x="752" y="584">alt : Vérifications</text>

  <!-- Auto-messages Service (self) -->
  <line x1="825" y1="600" x2="895" y2="600" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="895" y1="600" x2="895" y2="628" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="895" y1="628" x2="825" y2="628" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrReq)"/>
  <text class="selfLbl" x="838" y="596">Vérifier QR code valide</text>

  <line x1="825" y1="640" x2="895" y2="640" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="895" y1="640" x2="895" y2="668" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="895" y1="668" x2="825" y2="668" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrReq)"/>
  <text class="selfLbl" x="838" y="636">Vérifier enseignant assigné</text>

  <line x1="825" y1="680" x2="895" y2="680" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="895" y1="680" x2="895" y2="708" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="895" y1="708" x2="825" y2="708" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrReq)"/>
  <text class="selfLbl" x="838" y="676">Vérifier séance aujourd'hui + horaire</text>

  <line x1="825" y1="720" x2="895" y2="720" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="895" y1="720" x2="895" y2="748" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="895" y1="748" x2="825" y2="748" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrReq)"/>
  <text class="selfLbl" x="838" y="716">Vérifier géolocalisation (distance ≤ max)</text>

  <!-- Erreur vers enseignant -->
  <line x1="825" y1="770" x2="335" y2="770" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrErr)"/>
  <text class="msgErr" x="580" y="762" text-anchor="middle">Erreur : QR invalide/expiré, mauvaise personne, hors horaire ou trop loin</text>

  <!-- ==================== PHASE 4 : Enregistrement ==================== -->
  <text class="phase" x="40" y="805">Phase 4 — Enregistrement de l'émargement</text>

  <!-- Auto-message Service -->
  <line x1="825" y1="828" x2="905" y2="828" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="905" y1="828" x2="905" y2="856" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="905" y1="856" x2="825" y2="856" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrReq)"/>
  <text class="selfLbl" x="840" y="824">Créer / mettre à jour l'émargement (statut VALIDE)</text>

  <line x1="825" y1="876" x2="1048" y2="876" stroke="#334155" stroke-width="1.6" marker-end="url(#arrReq)"/>
  <text class="msg ital" x="936" y="862" text-anchor="middle">INSERT / UPDATE Emargement + Seance</text>

  <line x1="1048" y1="903" x2="825" y2="903" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrRet)"/>
  <text class="msgRet" x="936" y="895" text-anchor="middle">Émargement enregistré</text>

  <line x1="575" y1="930" x2="335" y2="930" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrOk)"/>
  <text class="msgOk" x="455" y="922" text-anchor="middle">200 OK : « Scan validé. Veuillez remplir la fiche de progression »</text>

  <!-- ==================== PHASE 5 : Fiche de progression ==================== -->
  <text class="phase" x="40" y="962">Phase 5 — Finalisation par la fiche de progression</text>

  <line x1="335" y1="985" x2="575" y2="985" stroke="#334155" stroke-width="1.6" marker-end="url(#arrReq)"/>
  <text class="msg" x="455" y="977" text-anchor="middle">POST /api/fiches-progression (remplit la fiche)</text>

  <line x1="575" y1="1008" x2="825" y2="1008" stroke="#334155" stroke-width="1.6" marker-end="url(#arrReq)"/>
  <text class="msg" x="700" y="1000" text-anchor="middle">Enregistrer la fiche de progression</text>

  <line x1="825" y1="1031" x2="1048" y2="1031" stroke="#334155" stroke-width="1.6" marker-end="url(#arrReq)"/>
  <text class="msg ital" x="936" y="1023" text-anchor="middle">INSERT FicheProgression</text>

  <line x1="575" y1="1056" x2="335" y2="1056" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrOk)"/>
  <text class="msgOk" x="455" y="1048" text-anchor="middle">200 OK : Émargement finalisé</text>
</svg>
