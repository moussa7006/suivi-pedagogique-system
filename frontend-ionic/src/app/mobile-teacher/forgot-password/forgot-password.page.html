<ion-content class="login-content" [fullscreen]="true">
  <div class="page-container">

    <!-- En-tête -->
    <div class="header-section">
      <img src="assets/logo_edutrack.png" alt="EduTrack Logo" class="app-logo" />
      <h1 class="brand-name">EduTrack</h1>
    </div>

    <!-- Carte de récupération -->
    <div class="login-card">
      <h2 class="form-title">Mot de passe oublié</h2>
      <p class="form-subtitle">Entrez votre email professionnel pour recevoir un code de réinitialisation.</p>

      <form (ngSubmit)="submit()" autocomplete="off">
        
        <!-- Champ Email -->
        <div class="input-group">
          <label for="email">Email professionnel</label>
          <div class="pill-input">
            <ion-input 
              id="email" 
              name="email"
              [(ngModel)]="email" 
              type="email" 
              placeholder="Entrez votre email"
              required
            ></ion-input>
          </div>
        </div>

        <!-- Bouton de validation -->
        <div class="action-container">
          <button type="submit" class="submit-btn" [disabled]="isLoading || !email">
            <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
            <span *ngIf="!isLoading">Recevoir le code</span>
          </button>
        </div>
      </form>

      <!-- Liens additionnels -->
      <div class="extra-links">
        <a routerLink="/mobile/reset-password" class="link-secondary">J'ai déjà un code</a>
        <a (click)="goToLogin()" class="link-primary">
          <ion-icon name="arrow-back-outline"></ion-icon>
          Retour à la connexion
        </a>
      </div>

    </div>
  </div>
</ion-content>
