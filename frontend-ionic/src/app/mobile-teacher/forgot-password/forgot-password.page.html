<ion-content class="login-content" [fullscreen]="true">
  <div class="login-container">

    <img src="assets/logo_edutrack.png" alt="EduTrack Logo" class="header-logo">

    <!-- En-tête -->
    <div class="header-section">
      <h1 class="hello-text">Mot de passe</h1>
      <p style="color: rgba(255, 255, 255, 0.8); margin-top: 10px;">Oublié ?</p>
    </div>

    <!-- Contenu Principal / Carte flottante -->
    <div class="login-card">
      
      <h2 class="login-title">Récupération</h2>
      <p class="form-subtitle">Entrez votre email professionnel pour recevoir un code de réinitialisation.</p>

      <!-- Erreur -->
      <div class="error-msg" *ngIf="errorMessage" style="margin-bottom: 16px;">
        <ion-icon name="alert-circle-outline" style="vertical-align: middle;"></ion-icon>
        <span style="margin-left: 4px; vertical-align: middle;">{{ errorMessage }}</span>
      </div>

      <form (ngSubmit)="submit()" autocomplete="off">
        
        <!-- Champ Email -->
        <div class="field-group">
          <div class="field">
            <ion-icon name="mail" class="field-icon"></ion-icon>
            <ion-input
              id="email"
              name="email"
              [(ngModel)]="email"
              type="email"
              placeholder="Email professionnel"
              required
            ></ion-input>
          </div>
        </div>

        <!-- Bouton de validation -->
        <button type="submit" class="login-btn" [disabled]="isLoading || !email">
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <span *ngIf="!isLoading">Recevoir le code</span>
        </button>
      </form>

      <!-- Liens additionnels -->
      <div class="extra-links">
        <a routerLink="/mobile/reset-password" class="link-secondary">J'ai déjà un code</a>
        <a (click)="goToLogin()" class="link-primary">
          <ion-icon name="arrow-back"></ion-icon>
          Retour à la connexion
        </a>
      </div>

    </div>
  </div>
</ion-content>
