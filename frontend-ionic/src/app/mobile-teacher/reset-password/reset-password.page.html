<ion-content class="login-content" [fullscreen]="true">
  <div class="login-container">

    <img src="assets/logo_edutrack.png" alt="EduTrack Logo" class="header-logo">

    <!-- En-tête -->
    <div class="header-section">
      <h1 class="hello-text">Nouveau</h1>
      <p style="color: rgba(255, 255, 255, 0.8); margin-top: 10px;">Mot de passe</p>
    </div>

    <!-- Carte de réinitialisation -->
    <div class="login-card">
      <h2 class="login-title">Réinitialiser</h2>
      <p class="form-subtitle">Saisissez le code reçu par email puis définissez votre nouveau mot de passe.</p>

      <!-- Message de succès (code envoyé) -->
      <div class="success-banner" *ngIf="successMessage">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
        <span>{{ successMessage }}</span>
      </div>

      <!-- Erreur -->
      <div class="error-msg" *ngIf="errorMessage" style="margin-bottom: 16px;">
        <ion-icon name="alert-circle-outline" style="vertical-align: middle;"></ion-icon>
        <span style="margin-left: 4px; vertical-align: middle;">{{ errorMessage }}</span>
      </div>

      <form (ngSubmit)="submit()" autocomplete="off">

        <!-- Champ Email -->
        <div class="field-group">
          <div class="field">
            <ion-icon name="mail" class="field-icon"></ion-icon>
            <ion-input
              id="email"
              name="email"
              [(ngModel)]="email"
              type="email"
              placeholder="Email professionnel"
            ></ion-input>
          </div>
        </div>

        <!-- Champ Code -->
        <div class="field-group">
          <div class="field">
            <ion-icon name="keypad" class="field-icon"></ion-icon>
            <ion-input
              id="code"
              name="code"
              [(ngModel)]="code"
              inputmode="numeric"
              maxlength="6"
              placeholder="Code à 6 chiffres"
            ></ion-input>
          </div>
        </div>

        <!-- Champ Nouveau mot de passe -->
        <div class="field-group">
          <div class="field">
            <ion-icon name="lock-closed" class="field-icon"></ion-icon>
            <ion-input
              id="newPassword"
              name="newPassword"
              [(ngModel)]="newPassword"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Nouveau mot de passe"
            ></ion-input>
            <ion-icon class="eye-toggle" [name]="showPassword ? 'eye-off' : 'eye'" (click)="togglePassword()"></ion-icon>
          </div>
          <div class="validation-hint">
            <small>Min 14 car., majuscule, minuscule, chiffre, symbole.</small>
          </div>
        </div>

        <!-- Champ Confirmation -->
        <div class="field-group">
          <div class="field">
            <ion-icon name="lock-closed" class="field-icon"></ion-icon>
            <ion-input
              id="confirmPassword"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              [type]="showConfirmPassword ? 'text' : 'password'"
              placeholder="Confirmez le mot de passe"
            ></ion-input>
            <ion-icon class="eye-toggle" [name]="showConfirmPassword ? 'eye-off' : 'eye'" (click)="toggleConfirmPassword()"></ion-icon>
          </div>
        </div>

        <!-- Bouton de validation -->
        <button type="submit" class="login-btn" [disabled]="isLoading">
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <span *ngIf="!isLoading">Réinitialiser</span>
        </button>
      </form>

      <!-- Liens additionnels -->
      <div class="extra-links">
        <a routerLink="/mobile/forgot-password" class="link-secondary">Recevoir un nouveau code</a>
        <a (click)="goToLogin()" class="link-primary">
          <ion-icon name="arrow-back"></ion-icon>
          Retour à la connexion
        </a>
      </div>

    </div>
  </div>
</ion-content>
