<ion-content class="login-content" [fullscreen]="true">
  <div class="page-container">

    <!-- En-tête -->
    <div class="header-section">
      <img src="assets/logo_edutrack.png" alt="EduTrack Logo" class="app-logo" />
      <h1 class="brand-name">EduTrack</h1>
    </div>

    <!-- Carte de connexion -->
    <div class="login-card">
      <h2 class="form-title">Bienvenue<br>Connectez-vous</h2>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off">
        
        <!-- Champ Email -->
        <div class="input-group">
          <label for="email">Identifiant / Email</label>
          <div class="pill-input">
            <ion-input id="email" formControlName="email" type="email" placeholder="Entrez votre email"></ion-input>
          </div>
          <div class="error-msg" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']">
            L'email est requis
          </div>
        </div>

        <!-- Champ Mot de passe -->
        <div class="input-group">
          <label for="password">Mot de passe</label>
          <div class="pill-input">
            <ion-input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Votre mot de passe"></ion-input>
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" (click)="togglePassword()" class="eye-toggle"></ion-icon>
          </div>
          <div class="error-msg" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']">
            Le mot de passe est requis
          </div>
        </div>

        <!-- Options (Souvenir / Oublié) -->
        <div class="form-options">
          <div class="remember-me">
            <ion-checkbox mode="md" [ngModel]="true" [ngModelOptions]="{standalone: true}">Se souvenir de moi</ion-checkbox>
          </div>
          <a routerLink="/mobile/forgot-password" class="forgot-link">Mot de passe oublié ?</a>
        </div>

        <!-- Bouton Connexion -->
        <div class="action-container">
          <button type="submit" class="submit-btn" [disabled]="isLoading">
            <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
            <span *ngIf="!isLoading">Se connecter</span>
          </button>
        </div>

      </form>
    </div>

  </div>
</ion-content>
