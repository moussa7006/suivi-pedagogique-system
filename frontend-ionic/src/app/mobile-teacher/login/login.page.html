<ion-content class="login-content" [fullscreen]="true">
  <div class="login-container">

    <img src="assets/logo_edutrack.png" alt="EduTrack Logo" class="header-logo">

    <!-- En-tête -->
    <div class="header-section">
      <h1 class="hello-text">Bienvenue</h1>
    </div>

    <!-- Contenu Principal / Carte flottante -->
    <div class="login-card">
      
      <h2 class="login-title">Connexion</h2>

      <!-- État du serveur -->
      <div class="status-banner server-banner error-msg" *ngIf="serverError" style="margin-bottom: 16px;">
        <ion-icon name="server-outline"></ion-icon>
        <span>{{ serverError }}</span>
      </div>

      <!-- Erreur de connexion -->
      <div class="status-banner error-banner error-msg" *ngIf="loginError" style="margin-bottom: 16px;">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ loginError }}</span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off">

        <!-- Champ Email -->
        <div class="field-group">
          <div class="field">
            <ion-icon name="mail" class="field-icon"></ion-icon>
            <ion-input id="email" formControlName="email" type="email" placeholder="Email"></ion-input>
          </div>
          <div class="error-msg" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']">
            L'email est requis
          </div>
        </div>

        <!-- Champ Mot de passe -->
        <div class="field-group group-password">
          <div class="field">
            <ion-icon name="lock-closed" class="field-icon"></ion-icon>
            <ion-input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Mot de passe"></ion-input>
            <ion-icon class="eye-toggle" [name]="showPassword ? 'eye-off' : 'eye'" (click)="togglePassword()"></ion-icon>
          </div>
          <div class="error-msg" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']">
            Le mot de passe est requis
          </div>
        </div>

        <!-- Mot de passe oublié -->
        <a routerLink="/mobile/forgot-password" class="forgot-link">Mot de passe oublié ?</a>

        <!-- Bouton Connexion -->
        <button type="submit" class="login-btn" [disabled]="isLoading">
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <span *ngIf="!isLoading">Se connecter</span>
        </button>

      </form>

    </div>

  </div>
</ion-content>
