spring.application.name=edutrack
server.port=${SERVER_PORT:8099}
server.forward-headers-strategy=framework

# --- Base de donnees PostgreSQL ---
# Definir DB_PASSWORD dans l'environnement en production (voir docs/backend-env.example).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_suivipedago}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# "update" pratique en dev ; passer a "validate" ou utiliser Flyway/Liquibase en production.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# --- Initialisation de la base de donnees via CommandLineRunner ---
app.init-db.enabled=${APP_INIT_DB_ENABLED:true}

spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Documentation API (OpenAPI / Swagger) ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- CORS ---
# Origines autorisees, separees par virgule. "*" desactive allowCredentials.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8100}
# En dev, autoriser toute origine http(s)://localhost / 127.0.0.1 sur port dynamique
# (utile pour le WebView Capacitor qui sert l'app sur un port aleatoire comme
# http://localhost:39341). Desactive en production.
app.cors.allow-localhost-dev=${APP_CORS_ALLOW_LOCALHOST_DEV:true}

# --- JWT ---
# IMPORTANT : en production, definir APP_JWT_SECRET avec une valeur forte (>= 32 octets).
app.jwt.secret=${APP_JWT_SECRET:edutrack-dev-jwt-secret-change-me-please-32-bytes-minimum}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# --- Compte administrateur initial (seed) ---
# Activer via APP_SEED_ADMIN_ENABLED=true ; desactive par defaut pour la production.
app.seed-admin.enabled=${APP_SEED_ADMIN_ENABLED:true}
app.seed-admin.reset-existing=${APP_SEED_ADMIN_RESET_EXISTING:false}
app.seed-admin.email=${APP_SEED_ADMIN_EMAIL:admin@edutrack.local}
app.seed-admin.password=${APP_SEED_ADMIN_PASSWORD:Admin1234!}
app.seed-admin.nom=${APP_SEED_ADMIN_NOM:Administrateur}
app.seed-admin.prenom=${APP_SEED_ADMIN_PRENOM:EduTrack}
app.seed-admin.matricule=${APP_SEED_ADMIN_MATRICULE:ADMIN-001}
app.seed-admin.telephone=${APP_SEED_ADMIN_TELEPHONE:00000000}
app.seed-admin.adresse=${APP_SEED_ADMIN_ADRESSE:EduTrack}

# --- Email SMTP (Gmail) pour l'envoi des codes de reinitialisation ---
# Ne pas stocker de secret dans Git : definir MAIL_USERNAME / MAIL_PASSWORD dans l'environnement.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Geolocalisation de l'emargement ---
# En dev, le controle de distance est desactive tant que les coordonnees exactes
# de l'ecole ne sont pas configurees.
emargement.geolocation.enabled=${EMARGEMENT_GEO_ENABLED:false}
emargement.geolocation.school-latitude=${EMARGEMENT_GEO_LAT:12.6392}
emargement.geolocation.school-longitude=${EMARGEMENT_GEO_LON:-8.0029}
emargement.geolocation.max-distance-km=${EMARGEMENT_GEO_MAX_KM:0.5}
