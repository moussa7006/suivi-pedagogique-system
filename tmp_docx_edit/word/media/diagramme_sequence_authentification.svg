<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="1090" viewBox="0 0 1490 1090">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#2f5597"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:22px;font-weight:bold}.actor{font-size:14px;font-weight:bold}.msg{font-size:12px}.alt{font-size:12px;font-weight:bold}</style></defs><rect x="0" y="0" width="1490" height="1090" fill="#ffffff"/><text class="title" x="745" y="36" text-anchor="middle">Diagramme de séquence - Authentification des utilisateurs</text><rect x="80" y="80" width="160" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.5"/><text class="actor" x="160" y="109" text-anchor="middle" fill="#1f2937">Utilisateur</text><line x1="160" y1="128" x2="160" y2="1050" stroke="#888" stroke-dasharray="7 6"/><rect x="310" y="80" width="160" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.5"/><text class="actor" x="390" y="109" text-anchor="middle" fill="#1f2937">Interface web/mobile</text><line x1="390" y1="128" x2="390" y2="1050" stroke="#888" stroke-dasharray="7 6"/><rect x="540" y="80" width="160" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.5"/><text class="actor" x="620" y="109" text-anchor="middle" fill="#1f2937">API Auth</text><line x1="620" y1="128" x2="620" y2="1050" stroke="#888" stroke-dasharray="7 6"/><rect x="770" y="80" width="160" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.5"/><text class="actor" x="850" y="109" text-anchor="middle" fill="#1f2937">AuthService</text><line x1="850" y1="128" x2="850" y2="1050" stroke="#888" stroke-dasharray="7 6"/><rect x="1000" y="80" width="160" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.5"/><text class="actor" x="1080" y="109" text-anchor="middle" fill="#1f2937">Base de données</text><line x1="1080" y1="128" x2="1080" y2="1050" stroke="#888" stroke-dasharray="7 6"/><rect x="1230" y="80" width="160" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.5"/><text class="actor" x="1310" y="109" text-anchor="middle" fill="#1f2937">JwtUtil</text><line x1="1310" y1="128" x2="1310" y2="1050" stroke="#888" stroke-dasharray="7 6"/><line x1="160" y1="175" x2="390" y2="175" stroke="#2f5597" stroke-width="1.6" marker-end="url(#arrow)"/><text class="msg" x="275" y="167" text-anchor="middle" fill="#111827">Saisir email et mot de passe</text><line x1="390" y1="245" x2="620" y2="245" stroke="#2f5597" stroke-width="1.6" marker-end="url(#arrow)"/><text class="msg" x="505" y="223" text-anchor="middle" fill="#111827">POST /api/auth/login</text><text class="msg" x="505" y="237" text-anchor="middle" fill="#111827">(email, motDePasse)</text><line x1="620" y1="315" x2="850" y2="315" stroke="#2f5597" stroke-width="1.6" marker-end="url(#arrow)"/><text class="msg" x="735" y="307" text-anchor="middle" fill="#111827">authentifier(loginRequest)</text><line x1="850" y1="385" x2="1080" y2="385" stroke="#2f5597" stroke-width="1.6" marker-end="url(#arrow)"/><text class="msg" x="965" y="377" text-anchor="middle" fill="#111827">Rechercher l’utilisateur par email normalisé</text><line x1="1080" y1="455" x2="850" y2="455" stroke="#2f5597" stroke-width="1.6" marker-start="url(#arrow)"/><text class="msg" x="965" y="447" text-anchor="middle" fill="#111827">Utilisateur trouvé</text><line x1="850" y1="525" x2="850" y2="525" stroke="#2f5597" stroke-width="1.6" marker-start="url(#arrow)"/><text class="msg" x="850" y="517" text-anchor="middle" fill="#111827">Vérifier que le compte est actif</text><line x1="850" y1="595" x2="850" y2="595" stroke="#2f5597" stroke-width="1.6" marker-start="url(#arrow)"/><text class="msg" x="850" y="573" text-anchor="middle" fill="#111827">Comparer le mot de passe saisi</text><text class="msg" x="850" y="587" text-anchor="middle" fill="#111827">avec le hash enregistré</text><rect x="55" y="611" width="1380" height="36" rx="4" fill="#fff7d6" stroke="#d6b656"/><text class="alt" x="70" y="634" fill="#7a5b00">alt : Erreur : email inconnu, compte désactivé ou mot de passe incorrect</text><line x1="850" y1="665" x2="620" y2="665" stroke="#2f5597" stroke-width="1.6" marker-start="url(#arrow)"/><text class="msg" x="735" y="657" text-anchor="middle" fill="#111827">Utilisateur authentifié</text><line x1="620" y1="735" x2="1310" y2="735" stroke="#2f5597" stroke-width="1.6" marker-end="url(#arrow)"/><text class="msg" x="965" y="727" text-anchor="middle" fill="#111827">generateToken(email, rôle)</text><line x1="1310" y1="805" x2="620" y2="805" stroke="#2f5597" stroke-width="1.6" marker-start="url(#arrow)"/><text class="msg" x="965" y="797" text-anchor="middle" fill="#111827">JWT signé</text><line x1="620" y1="875" x2="390" y2="875" stroke="#2f5597" stroke-width="1.6" marker-start="url(#arrow)"/><text class="msg" x="505" y="867" text-anchor="middle" fill="#111827">Réponse 200 : token + profil utilisateur</text><line x1="390" y1="945" x2="160" y2="945" stroke="#2f5597" stroke-width="1.6" marker-start="url(#arrow)"/><text class="msg" x="275" y="937" text-anchor="middle" fill="#111827">Redirection vers l’espace selon le rôle</text>
</svg>
